<!DOCTYPE html>


<html>

	<head>
		<title>My First Webpage</title>
		<link rel="stylesheet" href="styles.css"/>
	</head>
 
	<body class="dark-mode">
		
		<header>
			
			<nav>
				<div class="nav-item">
					<a href="index.html" title="Home">
						<img src="images/home-icon.png" alt="Home Icon" width="30px" height="30px">
						<p>Home</p>
					</a>
				</div>
				<div class="nav-item">
					<a href="about.html" title="About Me">
						<img src="images/about-icon.png" alt="About Me" width="30px" height="30px">
						<p>About</p>
					</a>
				</div>
				<div class="nav-item">
					<a href="projects.html" title="Projects">
						<img src="images/projects-icon.png" alt="Projects" width="30px" height="30px">
						<p>Projects</p>
						<span class="sticker">✨</span>
					</a>
				</div>
				
				<div class="nav-item">
					<a href="contact.html" title="Contact">
						<img src="images/contact-icon.png" alt="Contact" width="30px" height="30px">
						<p>Contact</p>
					</a>
				</div>
				<button class="toggle-btn">🌙Toggle Dark/Night Mode</button>
			</nav>
		
			<h1 id="main-heading">Welcome to My Portfolio!</h1>
		</header>
		<div class="wrap-container">
		
		<form style="line-height: 1;">
		
			<label for="name">Name:<span style="color: red;">*</span></label>
			<input type="text" name="name" id="name" placeholder="Enter your Name">
			<p id="nameError" style="color: red; display: none;">Name must not be empty</p>
			
			<br/>
			
			<label for="password">Password:<span style="color: red;">*</span></label>
			<input type="password" name="password" id="password" placeholder="Enter your Password">
			<p id="passError" style="color: red; display: none;">Password must have atleast 6 characters</p>
			<br/>

			<label for="cpassword">Confirm Password:<span style="color: red;">*</span></label>
			<input type="password" name="cpassword" id="cpassword" placeholder="Confirm Password">
			<p id="cpassError" style="color: red; display: none;">Password & Confirm Password is not same.</p>
			<br/>

			<label for="email">Email:<span style="color: red;">*</span></label>
			<input type="email" name="email" id="email" placeholder="Enter your Email">
			<p id="emailError" style="color: red; display: none;">Email is not correct</p>
			<br/>
			
			<label for="message">Message:</label>
			<textarea id="message" name="message" rows="4" cols="50"></textarea>
			<br/>
			<label for="contact_method" >Preferred Contact Method:</label>
			    <input type="radio" id="email_contact" name="contact_method" value="Email" checked>
				<label for="email_contact">Email</label>
				<input type="radio" id="phone_contact" name="contact_method" value="Phone">
				<label for="phone_contact">Phone</label>
				<br><br>

			
			
			<label for="services" >Services Interested In:</label>
				<input type="checkbox" id="web_design" name="services" value="Web Design" checked>
				<label for="web_design">Web Design</label>
				<input type="checkbox" id="seo" name="services" value="SEO">
				<label for="seo">SEO</label>
				<input type="checkbox" id="marketing" name="services" value="Marketing">
				<label for="marketing">Marketing</label>
				<br><br>

			
			
			<label for="budget">Estimated Budget:</label>
				<select id="budget" name="budget">
					<option value="under_500">Under $500</option>
					<option value="500_1000">$500 - $1000</option>
					<option value="above_1000">Above $1000</option>
				</select>
				<br><br>

			    <button type="button" onclick="validateForm()">Submit</button>
		
		</form>
		</div>
		
		<footer>
			<p>&copy; 2025 My Portfolio. All rights reserved.</p>
		</footer>
	
	<script src="script.js"></script>
	</body>
	
</html>
